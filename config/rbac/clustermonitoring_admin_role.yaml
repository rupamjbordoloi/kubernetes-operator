# This rule is not used by the project drishti itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over monitoring.drishti.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: drishti
    app.kubernetes.io/managed-by: kustomize
  name: clustermonitoring-admin-role
rules:
- apiGroups:
  - monitoring.drishti.io
  resources:
  - clustermonitorings
  verbs:
  - '*'
- apiGroups:
  - monitoring.drishti.io
  resources:
  - clustermonitorings/status
  verbs:
  - get
